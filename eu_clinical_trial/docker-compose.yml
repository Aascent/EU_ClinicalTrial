version: '3.8'

services:
  ctis-etl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eu_ctis_etl_pipeline
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Run initial sync on container startup
      # Options: 'historical' (default: full 12,000+ catalog backfill) or 'incremental' (recent daily delta)
      - RUN_ON_STARTUP=true
      - STARTUP_MODE=${STARTUP_MODE:-historical}
      # Cron schedule (Default: Daily at 02:00 AM UTC). Change e.g. to "0 */2 * * *" for every 2 hours
      - CRON_SCHEDULE=0 2 * * *
      - PYTHONUNBUFFERED=1
    ports:
      - "8080:8080"
    volumes:
      # Persistent local volumes for output files, state database, and logs
      - ./data:/app/data
      - ./logs:/app/logs
      - ./quarantine:/app/quarantine
      - ./tracker.db:/app/tracker.db
