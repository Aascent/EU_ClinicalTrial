name: clinical_trial_platform

services:
  eu_clinical_trial:
    build:
      context: ./eu_clinical_trial
      dockerfile: Dockerfile
    container_name: eu_clinical_trial_pipeline
    restart: unless-stopped
    env_file:
      - ./eu_clinical_trial/.env
    environment:
      - RUN_ON_STARTUP=${EU_RUN_ON_STARTUP:-true}
      - STARTUP_MODE=${EU_STARTUP_MODE:-status}
      - CRON_SCHEDULE=${EU_CRON_SCHEDULE:-0 2 * * *}
      - PYTHONUNBUFFERED=1
    ports:
      - "${EU_PORT:-8080}:8080"
    volumes:
      - ./eu_clinical_trial/data:/app/data
      - ./eu_clinical_trial/logs:/app/logs
      - ./eu_clinical_trial/quarantine:/app/quarantine
      - ./eu_clinical_trial/tracker.db:/app/tracker.db
    networks:
      - clinical_trial_network

  anz_clinical_trial:
    build:
      context: ./anz_clinical_trial
      dockerfile: Dockerfile
    container_name: anz_clinical_trial_pipeline
    restart: unless-stopped
    env_file:
      - ./anz_clinical_trial/.env
    environment:
      - RUN_ON_STARTUP=${ANZ_RUN_ON_STARTUP:-true}
      - STARTUP_MODE=${ANZ_STARTUP_MODE:-raw}
      - CRON_SCHEDULE=${ANZ_CRON_SCHEDULE:-0 3 * * *}
      - PORT=8081
      - PYTHONUNBUFFERED=1
    ports:
      - "${ANZ_PORT:-8081}:8081"
    volumes:
      - ./anz_clinical_trial/data:/app/data
      - ./anz_clinical_trial/logs:/app/logs
      - ./anz_clinical_trial/quarantine:/app/quarantine
      - ./anz_clinical_trial/tracker.db:/app/tracker.db
    networks:
      - clinical_trial_network

networks:
  clinical_trial_network:
    name: clinical_trial_network
    driver: bridge

